# Name of the workflow
name: CI

# Trigger conditions for the workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [created]

# Set permissions for the workflow
permissions:
  contents: write

# Opt in to Node.js 24 for JS-based actions (see GitHub Actions runner changelog).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Workflow jobs
jobs:
  # Base job that installs dependencies and sets up the environment
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group dev --extra cv-poc --no-interaction

  # Job to check code quality
  code-quality:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      # Re-checkout code since jobs run on different runners
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group dev --extra cv-poc --no-interaction

      - name: Run ruff
        run: uv run ruff check .

  # Job to run tests
  test:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    # 3.13 and 3.14 are the primary, fully-gated versions; 3.11/3.12 stay
    # supported (both still >1 year from EOL) but don't block merges.
    continue-on-error: ${{ matrix.python-version == '3.11' || matrix.python-version == '3.12' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --extra cv-poc --no-interaction

      - name: Run tests
        run: uv run pytest

  # Job to build and test Docker image
  docker:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      # Minimal setup for Docker build
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx for improved build performance
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t templify .

      # Remove interactive flag (-it) which can cause CI failures
      - name: Run Docker container
        run: docker run --rm templify

  # Job to deploy package to PyPI on release
  deploy:
    runs-on: ubuntu-latest
    needs: [setup, code-quality, test, docker]
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: '3.13'

      - name: Build and publish to PyPI
        run: |
          uv build
          uv publish --username "${{ secrets.PYPI_USERNAME }}" --password "${{ secrets.PYPI_PASSWORD }}"

  # Notification job that runs after all other jobs
  notify:
    runs-on: ubuntu-latest
    needs: [setup, code-quality, test, docker, deploy]
    if: always()  # Ensure this job always runs, even if previous jobs fail
    steps:
      - name: Notify on success
        if: success()
        run: echo "Build succeeded!"

      - name: Notify on failure
        if: failure()
        run: echo "Build failed!"
