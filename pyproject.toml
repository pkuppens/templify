[project]
name = "templify"
version = "0.2.0"
description = "A powerful templating library that supports multiple template formats and data structures"
readme = "README.md"
license = "MIT"
authors = [{name = "Pieter Kuppens", email = "pieter.kuppens@gmail.com"}]
requires-python = ">=3.11,<4.0"
dependencies = [
    "jmespath>=0.10.0,<0.11",
    "jinja2>=3.1.3",
    "reportlab>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/pkuppens/templify"
Repository = "https://github.com/pkuppens/templify"
Documentation = "https://github.com/pkuppens/templify"

[project.scripts]
templify = "templify.cli:main"

[project.optional-dependencies]
# Optional dependencies for the CV PoC's Word-document rendering (issue #11).
# Not part of templify's own runtime dependencies — install with
# `uv sync --extra cv-poc` (or `uv pip install .[cv-poc]`) when running the
# DOCX rendering path or its tests.
cv-poc = [
    "docxtpl>=0.16,<0.17",
    "PyYAML>=6.0,<7",
    "json5>=0.9,<1",
]

[dependency-groups]
dev = [
    "mkdocs>=1.5.3,<2",
    "mkdocs-material>=9.5.3,<10",
    "mkdocs-minify-plugin>=0.7.1,<0.9",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0,<2",
    "mkdocs-macros-plugin>=1.0.4,<2",
    "mkdocs-pdf-export-plugin>=0.5.10,<0.6",
    "mkdocs-redirects>=1.2.1,<2",
    "mkdocs-awesome-pages-plugin>=2.9.2,<3",
    "mkdocs-jupyter>=0.24.1,<0.25",
    "pymdown-extensions>=10.7,<11",
    "deptry>=0.12.0,<0.13",
    "pre-commit>=3.5.0,<4",
    "pytest>=7.4.3,<8",
    "pytest-cov>=4.1.0,<5",
    "ruff>=0.1.6,<0.2",
    "mypy>=1.7.1,<2",
    "pytest-mock>=3.12.0,<4",
    "pytest-xdist>=3.3.1,<4",
    "jsonschema>=4.20.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/templify"]

[tool.hatch.build.targets.sdist]
# Scope the sdist explicitly instead of globbing the whole project tree —
# avoids picking up local-only clutter (.codegraph/, .venv/, dist/, etc.)
# that doesn't exist in a fresh checkout.
include = [
    "src/templify",
    "README.md",
    "LICENSE",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Increase line length to 132 characters
line-length = 132

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Assume Python 3.11 (the minimum supported version)
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "RUF", "PL"]

# Suppress specific rules, grouped by category
ignore = [
    # Code structure and complexity
    "PLR0911",  # Too many return statements (max 8)
    "PLR0913",  # Too many arguments to function call

    # Type hints and imports
    "N817",     # CamelCase imported as acronym (ElementTree as ET)
    "RUF013",   # Implicit Optional in type hints

    # Code style and readability
    "RET504",   # Unnecessary assignment before return
    "UP035",    # Unnecessary assignment before return
    "UP006",    # Use tuple instead of list for static values

    # Test-specific
    "PLR2004",  # Magic numbers in tests
]

[tool.ruff.lint.isort]
known-first-party = ["templify"]

[tool.ruff.lint.per-file-ignores]
# Ignore imported but unused in __init__.py files
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=templify --cov-report=term-missing"
testpaths = [
    "tests",
    "examples/cv_resume_poc/tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: exercises optional heavier dependencies (e.g. docxtpl DOCX rendering)",
]
