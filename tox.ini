[tox]
skipsdist = true                   # Skip building a package distribution
envlist = py311, py312, py313, py314  # Currently supported Python versions (3.10 dropped, EOL Oct 2026)

[gh-actions]
python =
    3.11: py311                    # Maps GitHub Actions Python 3.11 to tox py311 env
    3.12: py312                    # Maps GitHub Actions Python 3.12 to tox py312 env
    3.13: py313                    # Maps GitHub Actions Python 3.13 to tox py313 env
    3.14: py314                    # Maps GitHub Actions Python 3.14 to tox py314 env

[testenv]
passenv = PYTHON_VERSION           # Pass PYTHON_VERSION environment variable to test environments
allowlist_externals = uv           # Allow tox to use the uv command
commands =
    uv sync --group dev            # Install dependencies via uv
    uv run pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
                                   # Run tests with doctests, generate coverage report in XML format
    uv run mypy                    # Run static type checking
    uv run ruff check .            # Run ruff linter (added for consistency with CI workflow)
